[project]
name = "arenero"
version = "0.1.0"
description = "A persistent Monty REPL and agent tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-monty>=0.0.21,<0.0.22",
    "urllib3>=2.5.0",
]

[project.optional-dependencies]
langchain = ["langchain>=1.3.18"]
mcp = [
    "httpx2>=2.12,<3",
    "mcp>=2,<3",
]

[dependency-groups]
dev = [
    "langchain>=1.3.18",
    "mcp>=2,<3",
    "ruff>=0.16.5,<0.17",
    "ty>=0.0.75,<0.0.76",
]

[project.scripts]
arenero = "arenero.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
